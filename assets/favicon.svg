<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- High-contrast dark background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="#06090e" stroke="#00f0ff" stroke-width="24" />
  
  <!-- Monogram FA in crisp code font -->
  <text x="50%" y="275" dominant-baseline="middle" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="200" font-weight="900" fill="#f8fafc" letter-spacing="-0.05em">FA</text>
  
  <!-- Green terminal caret indicator -->
  <text x="50%" y="415" dominant-baseline="middle" text-anchor="middle" font-family="monospace, Courier" font-size="105" font-weight="bold" fill="#10b981">&gt;_</text>
</svg>
